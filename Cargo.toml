[package]
name = "iso-843"
version = "0.2.1"
edition = "2024"
authors = ["misaka10987 <misaka10987@outlook.com>"]
description = "Rust Implementation (Lib / CLI) of the ISO 843 Greek Letter Transcription Standard."
documentation = "https://github.com/misaka10987/iso-843"
homepage = "https://github.com/misaka10987/iso-843"
repository = "https://github.com/misaka10987/iso-843"
readme = "README.md"
keywords = ["iso-843", "iso", "843", "greek", "transcription"]
license = "MIT"

[dependencies]
aho-corasick = "1.1.5"
anyhow = {version = "1.0.104", optional = true}
clap = { version = "4.6.7", features = ["derive"], optional = true }
colored = { version = "3.1.1", optional = true }

[features]
default = []
cli = ["clap", "colored", "anyhow"]

[[bin]]
name = "iso-843"
path = "src/main.rs"
required-features = ["cli"]
